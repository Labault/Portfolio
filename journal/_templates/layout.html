<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/style.css">

<!-- Primary Meta -->
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="Thibault Lafaurie">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{CANONICAL}}">

<!-- Theme -->
<meta name="theme-color" content="#1e2327">

<!-- Open Graph / Facebook / LinkedIn -->
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Thibault Lafaurie">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://labault.dev/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Thibault Lafaurie - Développeur Backend en prod">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://labault.dev/og-image.png">
<meta name="twitter:image:alt" content="Thibault Lafaurie - Développeur Backend en prod">

<!-- Favicon : la mascotte Canard Dev -->
<link rel="icon" type="image/png" href="/favicon.png">

<!-- Analytics : Umami self-hosted (stats.labault.dev) -->
<script defer src="https://stats.labault.dev/labault.js" data-website-id="b345c42f-7848-43cb-a86e-927df3eae2e8"></script>
{{HEAD_EXTRA}}
</head>
<body>

<a class="skip-link" href="#main">Aller au contenu</a>

<!--
  Still reading the source on the journal pages too? Of course you are.
  Same deal as the home page: no framework, no bundler, zero runtime JS.
  These pages are generated locally by a small PHP script (build.php),
  from Markdown. The thing you're reading is the plain HTML it spat out.
-->

<div class="browser-frame">
  <div class="browser-chrome">
    <div class="browser-chrome-dot" style="background: #C9BCA8;"></div>
    <div class="browser-chrome-dot" style="background: #B5341A;"></div>
    <div class="browser-chrome-dot" style="background: #5A7236;"></div>
    <div class="browser-chrome-url">{{CHROME_URL}}</div>
  </div>

  <div class="page">

    <nav class="nav" aria-label="Navigation principale">
      <a href="/#index" class="nav-logo">
        <div class="nav-logo-dot" aria-hidden="true"></div>
        <span class="nav-logo-name">Thibault Lafaurie</span>
      </a>
      <ul class="nav-links" role="list">
        <li><a href="/#index"    class="nav-link">index</a></li>
        <li><a href="/#parcours" class="nav-link">parcours</a></li>
        <li><a href="/#stack"    class="nav-link">stack</a></li>
        <li><a href="/#projets"  class="nav-link">projets</a></li>
        <li><a href="/journal/"  class="nav-link" aria-current="page">journal</a></li>
        <li><a href="/#contact"  class="nav-link">contact</a></li>
      </ul>
      <div class="nav-status" aria-label="Statut : en recherche d'un CDI">
        <span class="nav-status-dot anim-pulse"></span>
        <span class="nav-status-text">en recherche d'un CDI</span>
      </div>
    </nav>

{{MAIN}}

  </div>
</div>

</body>
</html>
