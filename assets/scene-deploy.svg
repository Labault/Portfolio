<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="push-to-deploy">
  <rect width="400" height="300" fill="#EFE7DA"/>
  <text x="40" y="46" font-family="Georgia, 'DM Serif Display', serif" font-size="21" fill="#1F1A14">push-to-deploy</text>
  <text x="40" y="64" font-family="Inter, system-ui, sans-serif" font-size="10" letter-spacing="0.06em" fill="#B5341A">commit → prod, sans toucher à rien</text>

  <!-- Pipeline -->
  <g>
    <rect x="34" y="92" width="92" height="54" rx="9" fill="#FBF8F2" stroke="#DBCBB0" stroke-width="1.2"/>
    <text x="80" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#41382E">git push</text>
  </g>
  <path d="M126 119 h26 m0 0 l-6 -4 m6 4 l-6 4" stroke="#B5341A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="154" y="92" width="92" height="54" rx="9" fill="#FBF8F2" stroke="#DBCBB0" stroke-width="1.2"/>
    <path d="M203 104 l-9 16 h7 l-4 14 13 -18 h-7 z" fill="#5A7236"/>
    <text x="200" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#41382E">webhook</text>
  </g>
  <path d="M246 119 h26 m0 0 l-6 -4 m6 4 l-6 4" stroke="#B5341A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="274" y="92" width="92" height="54" rx="9" fill="#FBF8F2" stroke="#DBCBB0" stroke-width="1.2"/>
    <g stroke="#6B6258" stroke-width="1.3" fill="none">
      <rect x="300" y="104" width="40" height="9" rx="2"/><rect x="300" y="116" width="40" height="9" rx="2"/>
    </g>
    <circle cx="306" cy="108.5" r="1.4" fill="#8FB45C"/><circle cx="306" cy="120.5" r="1.4" fill="#8FB45C"/>
    <text x="320" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#41382E">prod ✓</text>
  </g>

  <!-- Fusée -->
  <g transform="rotate(28 332 84)">
    <path d="M332 60 c8 6 9 22 0 34 c-9 -12 -8 -28 0 -34 z" fill="#FBF8F2" stroke="#C7723E" stroke-width="1.4"/>
    <circle cx="332" cy="78" r="3.4" fill="#B5341A"/>
    <path d="M326 90 l-5 9 6 -3 z M338 90 l5 9 -6 -3 z" fill="#C7723E"/>
    <path d="M329 94 q3 9 6 0" fill="none" stroke="#B5341A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="150" y="172" width="100" height="24" rx="12" fill="#E3E7D6"/>
    <text x="200" y="188" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#43581F">déployé en 12 s ✓</text>
  </g>

  <!-- Cheminement : machine → projet → serveur → prod -->
  <g font-family="Inter, system-ui, sans-serif" font-size="8.5" text-anchor="middle">
    <line x1="80" y1="246" x2="150" y2="246" stroke="#B5341A" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="246" x2="240" y2="246" stroke="#B5341A" stroke-width="2" stroke-linecap="round"/>
    <line x1="260" y1="246" x2="330" y2="246" stroke="#B5341A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="70" cy="246" r="7" fill="#B5341A" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="160" cy="246" r="7" fill="#B5341A" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="250" cy="246" r="7" fill="#B5341A" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="340" cy="246" r="7" fill="#B5341A" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="340" cy="246" r="10.5" fill="none" stroke="#B5341A" stroke-width="1.6"/>
    <text x="70" y="267" fill="#9C9286">machine</text>
    <text x="160" y="267" fill="#9C9286">projet</text>
    <text x="250" y="267" fill="#9C9286">serveur</text>
    <text x="340" y="267" fill="#1F1A14" font-weight="700">prod</text>
  </g>

  <rect x="343" y="14" width="9" height="9" rx="2" fill="#B5341A"/>
</svg>
