<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="bootstrap-web-setup">
  <rect width="400" height="300" fill="#FBF8F2"/>

  <!-- Terminal -->
  <rect x="28" y="28" width="312" height="188" rx="9" fill="#1E2230" stroke="#11131C" stroke-width="1"/>
  <circle cx="46" cy="46" r="4.5" fill="#C9BCA8"/><circle cx="63" cy="46" r="4.5" fill="#B5341A"/><circle cx="80" cy="46" r="4.5" fill="#5A7236"/>
  <text x="184" y="50" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#7E839A">~/projet</text>
  <line x1="28" y1="60" x2="340" y2="60" stroke="#2A2F3E" stroke-width="1"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
    <text x="44" y="86"><tspan fill="#B5341A">$</tspan><tspan fill="#D7DBE6"> bootstrap-web-setup</tspan></text>
    <text x="44" y="108" fill="#A9AEBE">▸ cs-fixer · phpstan</text><text x="320" y="108" text-anchor="end" fill="#8FB45C">✓</text>
    <text x="44" y="128" fill="#A9AEBE">▸ ci · github actions</text><text x="320" y="128" text-anchor="end" fill="#8FB45C">✓</text>
    <text x="44" y="148" fill="#A9AEBE">▸ secrets · gitleaks</text><text x="320" y="148" text-anchor="end" fill="#8FB45C">✓</text>
    <text x="44" y="168" fill="#A9AEBE">▸ editorconfig</text><text x="320" y="168" text-anchor="end" fill="#8FB45C">✓</text>
    <text x="44" y="196" fill="#E7E2D4">config posée</text><rect x="136" y="186" width="8" height="13" fill="#E7E2D4"/>
  </g>

  <!-- Cheminement : machine → projet → serveur → prod -->
  <g font-family="Inter, system-ui, sans-serif" font-size="8.5" text-anchor="middle">
    <line x1="80" y1="246" x2="150" y2="246" stroke="#B5341A" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="246" x2="240" y2="246" stroke="#CDBFA8" stroke-width="2" stroke-linecap="round"/>
    <line x1="260" y1="246" x2="330" y2="246" stroke="#CDBFA8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="70" cy="246" r="7" fill="#B5341A" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="160" cy="246" r="7" fill="#B5341A" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="160" cy="246" r="10.5" fill="none" stroke="#B5341A" stroke-width="1.6"/>
    <circle cx="250" cy="246" r="7" fill="#FBF8F2" stroke="#C9B79A" stroke-width="1"/>
    <circle cx="340" cy="246" r="7" fill="#FBF8F2" stroke="#C9B79A" stroke-width="1"/>
    <text x="70" y="267" fill="#9C9286">machine</text>
    <text x="160" y="267" fill="#1F1A14" font-weight="700">projet</text>
    <text x="250" y="267" fill="#9C9286">serveur</text>
    <text x="340" y="267" fill="#9C9286">prod</text>
  </g>

  <rect x="343" y="14" width="9" height="9" rx="2" fill="#B5341A"/>
