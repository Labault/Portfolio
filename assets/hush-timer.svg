<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hushAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="55%"  stop-color="#5B21B6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0B14"  stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hushCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A0B14"  stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="#0A0B14"/>

  <!-- Ambient purple aura -->
  <ellipse cx="200" cy="148" rx="190" ry="148" fill="url(#hushAura)"/>

  <!-- Concentric ripple rings -->
  <circle cx="200" cy="145" r="112" fill="none" stroke="#6D5BE0" stroke-width="0.5" opacity="0.13"/>
  <circle cx="200" cy="145" r="86"  fill="none" stroke="#7C6CF0" stroke-width="0.7" opacity="0.20"/>
  <circle cx="200" cy="145" r="62"  fill="none" stroke="#9B8CF0" stroke-width="0.9" opacity="0.30"/>
  <circle cx="200" cy="145" r="40"  fill="none" stroke="#B0A0FA" stroke-width="1.1" opacity="0.45"/>
  <circle cx="200" cy="145" r="20"  fill="none" stroke="#C4B5FD" stroke-width="1.4" opacity="0.65"/>

  <!-- Center dot -->
  <circle cx="200" cy="145" r="22" fill="url(#hushCore)"/>
  <circle cx="200" cy="145" r="5"  fill="#DDD6FE" opacity="0.95"/>
  <circle cx="200" cy="145" r="2.5" fill="#FFFFFF" opacity="0.9"/>

  <text x="200" y="238" text-anchor="middle" fill="#6D5BE0" font-family="Georgia, serif" font-size="10" letter-spacing="5" opacity="0.55">HUSH</text>
</svg>
