<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Red Flag Bingo">
  <defs>
    <linearGradient id="rfb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0432E"/>
      <stop offset="1" stop-color="#9C2A1C"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#rfb-sky)"/>
  <circle cx="210" cy="150" r="124" fill="#D9745C" opacity="0.35"/>

  <text x="30" y="34" font-family="Inter, system-ui, sans-serif" font-size="10" letter-spacing="0.13em" fill="#FCEBD0">ICI, LES RED FLAGS FONT GAGNER</text>

  <!-- Drapeau qui flotte derrière la carte (le « personnage ») -->
  <g>
    <line x1="160" y1="40" x2="160" y2="78" stroke="#F4EFE3" stroke-width="3" stroke-linecap="round"/>
    <path d="M160 42 c14 4 30 4 44 0 c-4 8 -4 13 0 20 c-14 4 -30 4 -44 0 z" fill="#E85C3F" stroke="#FCEBD0" stroke-width="2"/>
  </g>

  <!-- Carte de bingo -->
  <rect x="108" y="70" width="204" height="194" rx="14" fill="#FCF5E8" stroke="#7A1E12" stroke-width="1.5"/>

  <g font-family="Georgia, 'DM Serif Display', serif" font-size="22" text-anchor="middle" font-weight="700">
    <text x="150" y="104" fill="#B5341A">B</text>
    <text x="180" y="104" fill="#E0951F">I</text>
    <text x="210" y="104" fill="#5A7236">N</text>
    <text x="240" y="104" fill="#C4602A">G</text>
    <text x="270" y="104" fill="#1F1A14">O</text>
  </g>
  <line x1="124" y1="112" x2="296" y2="112" stroke="#ECD3AC" stroke-width="1"/>

  <!-- Grille 3x3 -->
  <g fill="#FDF4E1" stroke="#EAD3AB" stroke-width="1">
    <rect x="124" y="120" width="48" height="26" rx="4"/><rect x="186" y="120" width="48" height="26" rx="4"/><rect x="248" y="120" width="48" height="26" rx="4"/>
    <rect x="124" y="158" width="48" height="26" rx="4"/><rect x="186" y="158" width="48" height="26" rx="4"/><rect x="248" y="158" width="48" height="26" rx="4"/>
    <rect x="124" y="196" width="48" height="26" rx="4"/><rect x="186" y="196" width="48" height="26" rx="4"/><rect x="248" y="196" width="48" height="26" rx="4"/>
  </g>

  <!-- Ligne gagnante (diagonale) -->
  <line x1="148" y1="133" x2="272" y2="209" stroke="#B5341A" stroke-width="3.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Coches des autres joueurs -->
  <circle cx="272" cy="133" r="9" fill="#E0951F"/>
  <circle cx="148" cy="209" r="9" fill="#C4602A"/>

  <!-- Jetons « red flag » de la ligne gagnante -->
  <g fill="#B5341A">
    <circle cx="148" cy="133" r="11"/><circle cx="210" cy="171" r="11"/><circle cx="272" cy="209" r="11"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.6" fill="none">
    <path d="M145 127 v12"/><path d="M207 165 v12"/><path d="M269 203 v12"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M145 127 L153 130 L145 133 Z"/><path d="M207 165 L215 168 L207 171 Z"/><path d="M269 203 L277 206 L269 209 Z"/>
  </g>

  <!-- Tampon -->
  <g transform="rotate(-8 210 244)">
    <rect x="140" y="228" width="140" height="32" rx="5" fill="none" stroke="#B5341A" stroke-width="2.5"/>
    <rect x="145" y="233" width="130" height="22" rx="3" fill="none" stroke="#B5341A" stroke-width="1"/>
    <text x="210" y="249" text-anchor="middle" font-family="Georgia, 'DM Serif Display', serif" font-size="16" letter-spacing="0.05em" fill="#B5341A">RED FLAG !</text>
  </g>

  <rect x="361" y="279" width="9" height="9" rx="2" fill="#FCEBD0"/>
</svg>
